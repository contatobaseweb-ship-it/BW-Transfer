<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BW Transfer</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Arial}main{max-width:700px;margin:auto;padding:8px 5px}textarea{width:100%;height:155px;background:#fff;border:2px solid #ccc;padding:13px;font:16px Arial;color:#111;resize:vertical}.btn{background:#bfc3c7;color:#111;border:0;padding:12px 17px;font-weight:bold;cursor:pointer}.row{display:flex;gap:10px;align-items:center;margin:8px 0 16px}.circle{width:145px;height:145px;border-radius:50%;background:#bfc3c7;color:#111;font-weight:bold}.tabs{display:flex;gap:18px;margin:12px 0}.tabs button{background:none;color:#aaa;border:0;text-decoration:underline}.tabs .active{color:#bfc3c7}#status{margin:14px 0;font:bold 14px Georgia}#result{font:bold 38px Georgia;color:#bfc3c7;overflow-wrap:anywhere}#found{display:none;border-top:1px solid #444;margin-top:15px;padding-top:12px}#content{white-space:pre-wrap;background:#171717;padding:12px;overflow-wrap:anywhere}a{color:#bfc3c7}#history{border-top:1px solid #333;margin-top:20px;padding-top:10px;color:#aaa;font-size:12px}.hist{padding:7px;border-bottom:1px solid #222;display:flex;justify-content:space-between}#file{display:none}.hidden{display:none}
</style></head><body><main>
<section id="sendView"><textarea id="text" placeholder="Digite ou cole seu texto aqui..."></textarea><div class="row"><button class="circle" id="pick">＋<br>ESCOLHER<br>ARQUIVO</button><input id="file" type="file"><div><div id="fileName">Nenhum arquivo selecionado</div><button class="btn" id="send">ENVIAR</button></div></div></section>
<section class="tabs"><button id="sendTab" class="active">Enviar conteúdo</button><button id="getTab">Consultar código</button></section>
<section id="getView" class="hidden"><textarea id="code" placeholder="Digite ou cole seu código aqui..."></textarea><div class="row"><button class="btn" id="lookup">ACESSAR</button></div></section>
<div id="status">Digite um texto ou escolha um arquivo.</div><div id="result"></div>
<section id="found"><b>CONTEÚDO SALVO</b><div id="content"></div><div id="download"></div><button class="btn" id="copy">COPIAR TEXTO</button><button class="btn" id="del">EXCLUIR</button></section>
<div id="history"><b>ÚLTIMOS CÓDIGOS NESTE APARELHO</b><div id="historyList"></div></div><p style="color:#888;font-size:12px">BW TRANSFER</p></main>
<script>
const $=x=>document.getElementById(x);let files=[],activeCode='',activeText='';
function status(t){$('status').textContent=t}function addHistory(c){let a=JSON.parse(localStorage.bwCodes||'[]');a=[c,...a.filter(x=>x!==c)].slice(0,10);localStorage.bwCodes=JSON.stringify(a);renderHistory()}
function renderHistory(){$('historyList').innerHTML='';(JSON.parse(localStorage.bwCodes||'[]')).forEach(c=>{let d=document.createElement('div');d.className='hist';let s=document.createElement('b');s.textContent=c;let b=document.createElement('button');b.className='btn';b.textContent='ABRIR';b.onclick=()=>{$('code').value=c;show('get');lookup()};d.append(s,b);$('historyList').append(d)})}
function show(v){$('sendView').classList.toggle('hidden',v!=='send');$('getView').classList.toggle('hidden',v!=='get');$('sendTab').classList.toggle('active',v==='send');$('getTab').classList.toggle('active',v==='get');$('found').style.display='none';$('result').textContent='';status(v==='send'?'Digite um texto ou escolha um arquivo.':'Digite o código para recuperar o conteúdo.')}
$('sendTab').onclick=()=>show('send');$('getTab').onclick=()=>show('get');$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{files=[...e.target.files];$('fileName').textContent=files.map(f=>f.name).join(', ')||'Nenhum arquivo selecionado'};
$('send').onclick=async()=>{if(!$('text').value.trim()&&!files.length)return status('Digite um texto ou escolha um arquivo.');let b=$('send');b.disabled=true;status('Salvando conteúdo...');try{let f=new FormData();f.append('text',$('text').value);files.forEach(x=>f.append('files',x));let r=await fetch('/.netlify/functions/create',{method:'POST',body:f}),j=await r.json();if(!r.ok)throw Error(j.error);activeCode=j.code;$('result').textContent=j.code;addHistory(j.code);$('text').value='';files=[];$('file').value='';$('fileName').textContent='Nenhum arquivo selecionado';status('Salvo! Guarde este código para acessar de outro lugar.')}catch(e){status(e.message)}b.disabled=false};
async function lookup(){let c=$('code').value.trim().toUpperCase();if(!c)return status('Digite o código.');status('Buscando...');try{let r=await fetch('/.netlify/functions/get',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:c})}),j=await r.json();if(!r.ok)throw Error(j.error);activeCode=c;activeText=j.text||'';$('result').textContent=c;$('content').textContent=activeText||'(Sem texto)';$('download').innerHTML='';if(j.file_url){let a=document.createElement('a');a.href=j.file_url;a.textContent='BAIXAR '+j.file_name;a.target='_blank';$('download').append(a)}$('found').style.display='block';addHistory(c);status('Conteúdo encontrado.')}catch(e){status(e.message)}}
$('lookup').onclick=lookup;$('copy').onclick=()=>navigator.clipboard.writeText(activeText).then(()=>status('Texto copiado.'));
$('del').onclick=async()=>{if(!confirm('Excluir este conteúdo?'))return;let r=await fetch('/.netlify/functions/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:activeCode})}),j=await r.json();if(!r.ok)return status(j.error);$('found').style.display='none';$('result').textContent='';status('Conteúdo excluído.')};renderHistory();
</script></body></html>
